name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Manage release PR and tags
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Optional PAT (RELEASE_PLEASE_TOKEN) ensures created GitHub Releases
          # automatically trigger downstream workflows (such as pypi-release.yml).
          # Falls back to GITHUB_TOKEN if no custom token secret is configured.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
