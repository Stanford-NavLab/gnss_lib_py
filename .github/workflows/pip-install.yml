name: pip-install

on:
  pull_request:
    branches:
      - main
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    name: Testing pip install, updating requirements.txt
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install using pip
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-env
        pip install -e .
    # Cache ephemeris data to prevent downloading files repeatedly
    - name: Cache ephemeris data
      uses: actions/cache@v6
      with:
        path: |
          data/ephemeris
          data/unit_test/ephemeris_downloader_tests
        key: ephem-${{ runner.os }}-${{ hashFiles('tests/utils/test_ephemeris_downloader.py') }}
        restore-keys: |
          ephem-${{ runner.os }}-
          ephem-
    - name: Test on pytest
      run:
        pytest
