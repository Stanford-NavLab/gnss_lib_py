name: dependabot-auto-merge

on:
  pull_request_target:
    branches:
      - main
      - v*.*.*

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Auto-approve patch and minor updates, while requiring manual review for semver-major updates
      - name: Approve PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Enable auto-merge so GitHub automatically merges the PR once CI checks pass
      - name: Enable Auto-Merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}" || \
          gh pr merge --auto --merge "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
