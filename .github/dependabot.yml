# Dependabot configuration for gnss_lib_py
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. Python dependencies managed with Poetry
  # Dependabot monitors pyproject.toml & poetry.lock under the "pip" ecosystem.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "chore"
      include: "scope"
    # Group patch and minor updates into a single PR to reduce review noise
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # Ignore packages with strict compatibility constraints
    ignore:
      - dependency-name: "georinex"
        versions:
          - ">1.16.1"
      - dependency-name: "xarray"
        versions:
          - ">2024.7.0"
      - dependency-name: "kaleido"
        versions:
          - ">0.2.1"

  # 2. GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "friday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
