[tool.poetry]
name = "gnss-lib-py"
version = "1.1.0"
description = "Modular Python tool for parsing, analyzing, and visualizing Global Navigation Satellite Systems (GNSS) data and state estimates"
authors = ["Derek Knowles <betabison@gmail.com>",
           "Ashwin Kanhere <LastNameFirstName@gmail.com",
           "Daniel Neamati <dneamati@stanford.edu>",
           ]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Stanford-NavLab/gnss_lib_py"
documentation = "https://gnss-lib-py.readthedocs.io/en/latest/"
keywords = ["gnss"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.10, < 3.15"
numpy = "^2.1.0"
pandas = "^2.0.0"
georinex = "<=1.16.1"
unlzw3 = "^0.2.3"
pynmea2 = "^1.19.0"
scipy = "^1.14.1"
matplotlib = "^3.10.0"
plotly = "^5.24.1"
kaleido = "0.2.1"
requests = "^2.32.0"
xarray = "<=2024.7.0"

[tool.poetry.group.dev.dependencies]
Sphinx = "^7.3.0"
sphinx-rtd-theme = "^1.0.0"
sphinxcontrib-napoleon = "^0.7"
pylint-exit = "^1.2.0"
nbsphinx = "^0.8.9"
nbsphinx-link = "^1.3.0"
tqdm = "^4.66.0"
pylint = "^2.11.1"
pytest = ">=7.4.0"
pytest-cov = "^4.1.0"
pytest-env = ">=0.8.0,<1.3.0"
sphinx-copybutton = "^0.5.2"
poetry-plugin-export = "^1.8.0"
jupyter = "^1.1.0"
notebook = ">=7.0.0"
ipykernel = "^6.29.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
